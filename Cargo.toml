[workspace]
resolver = "3"
members = [
    "crates/rustline-proto",
    "crates/rustline-core",
    "crates/rustline-media",
    "crates/rustline-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["augustuz"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# SIP protocol
rsip = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# UUID for call IDs
uuid = { version = "1", features = ["v4"] }

# Crypto (Digest Auth MD5)
md-5 = "0.10"
